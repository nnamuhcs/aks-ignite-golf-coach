apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golf-coach-frontend
  template:
    metadata:
      labels:
        app: golf-coach-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/nnamuhcs/aks-ignite-golf-coach-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 4
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  selector:
    app: golf-coach-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
