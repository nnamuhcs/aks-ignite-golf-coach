name: Frontend build only (no Azure deployment)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildImage:
    name: Build frontend image (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend container
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: aks-ignite-golf-coach-frontend:${{ github.sha }}

      - name: Report build-only scope
        run: |
          {
            echo "## Frontend container build succeeded"
            echo "Azure deployment is disabled in this workflow."
            echo "This run does not authenticate to Azure, push to ACR, or deploy to Fleet or AKS."
          } >> "$GITHUB_STEP_SUMMARY"
